databaseChangeLog:
  - changeSet:
      id: 1
      author: yak
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: password
                  type: varchar(255)
              - column:
                  name: first_name
                  type: varchar(255)
              - column:
                  name: last_name
                  type: varchar(255)
              - column:
                  name: phone
                  type: varchar(255)
              - column:
                  name: role
                  type: varchar(255)
              - column:
                  name: image
                  type: varchar(255)

  - changeSet:
      id: 2
      author: yak
      changes:
        - createTable:
            tableName: ads
            columns:
              - column:
                  name: pk
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: price
                  type: int
              - column:
                  name: description
                  type: varchar(255)
              - column:
                  name: image
                  type: varchar(255)
              - column:
                  name: user_id
                  type: int

  - changeSet:
      id: 3
      author: yak
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: pk
                  type: int
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: text
                  type: varchar(255)
              - column:
                  name: created_at
                  type: bigint
              - column:
                  name: ad_id
                  type: int
              - column:
                  name: user_id
                  type: int